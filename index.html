<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --accent: #38bdf8;
    --x-color: #38bdf8;
    --o-color: #f472b6;
    --win: #4ade80;
    --text: #e2e8f0;
    --muted: #94a3b8;
    /* glass */
    --glass: rgba(255, 255, 255, .06);
    --glass-2: rgba(255, 255, 255, .09);
    --glass-border: rgba(255, 255, 255, .12);
    --grad: linear-gradient(135deg, #38bdf8, #818cf8);
    --grad-o: linear-gradient(135deg, #f472b6, #fb7185);
    --grad-win: linear-gradient(135deg, #4ade80, #22d3ee);
    --ease: cubic-bezier(.22, .61, .36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(60vw 60vw at 12% -10%, rgba(56, 189, 248, .22), transparent 60%),
      radial-gradient(55vw 55vw at 110% 30%, rgba(244, 114, 182, .16), transparent 60%),
      radial-gradient(70vw 50vw at 50% 120%, rgba(129, 140, 248, .18), transparent 65%),
      linear-gradient(180deg, #131c31, var(--bg));
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .app { width: 100%; max-width: 900px; animation: rise .5s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  h1 {
    text-align: center;
    font-size: 2.2rem;
    letter-spacing: 6px;
    margin-bottom: 6px;
    text-transform: uppercase;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(56, 189, 248, .35));
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 24px;
    font-size: .78rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(280px, 360px) 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 20px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .08),
      0 12px 32px rgba(0, 0, 0, .38);
  }

  /* Status */
  #status {
    text-align: center;
    font-size: 1.05rem;
    font-weight: 600;
    min-height: 28px;
    margin-bottom: 12px;
  }
  #status.thinking { color: var(--muted); font-style: italic; }

  /* 3D stage */
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(56, 189, 248, .10), transparent 60%),
      radial-gradient(100% 80% at 50% 110%, rgba(244, 114, 182, .10), transparent 60%),
      rgba(15, 23, 42, .55);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), inset 0 -20px 40px rgba(0, 0, 0, .25);
    touch-action: none;
    cursor: default;
  }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .stage-note {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 8px;
    text-align: center;
    font-size: .68rem;
    letter-spacing: .5px;
    color: var(--muted);
    pointer-events: none;
  }

  /* DOM fallback board (no WebGL) */
  .fb-board {
    position: absolute;
    inset: 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .fb-board button {
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: 700;
    border-radius: 14px;
    padding: 0;
    -webkit-text-fill-color: currentColor;
    background: var(--glass-2);
    border: 1px solid var(--glass-border);
    color: var(--text);
    box-shadow: none;
  }
  .fb-board button:disabled { opacity: 1; }
  .fb-board button.x { color: var(--x-color); }
  .fb-board button.o { color: var(--o-color); }
  .fb-board button.win {
    background: rgba(74, 222, 128, .18);
    border-color: var(--win);
    color: var(--win);
    box-shadow: 0 0 16px rgba(74, 222, 128, .45);
  }

  /* Controls */
  .controls { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit;
    font-size: .9rem;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    background: var(--glass-2);
    color: var(--text);
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background .2s var(--ease), border-color .2s var(--ease),
                box-shadow .2s var(--ease), transform .15s var(--ease);
  }
  button:hover {
    background: rgba(255, 255, 255, .15);
    border-color: rgba(56, 189, 248, .6);
    box-shadow: 0 0 16px rgba(56, 189, 248, .25);
    transform: translateY(-1px);
  }
  button:active { transform: translateY(0); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary {
    background: var(--grad);
    border-color: transparent;
    color: #082f49;
    -webkit-text-fill-color: #082f49;
    box-shadow: 0 4px 18px rgba(56, 189, 248, .35);
  }
  button.primary:hover {
    background: var(--grad);
    border-color: transparent;
    box-shadow: 0 6px 24px rgba(56, 189, 248, .5);
    transform: translateY(-1px);
  }
  button.danger {
    border-color: rgba(239, 68, 68, .45);
    color: #fca5a5;
    background: rgba(239, 68, 68, .12);
  }
  button.danger:hover {
    background: rgba(239, 68, 68, .22);
    border-color: #ef4444;
    box-shadow: 0 0 16px rgba(239, 68, 68, .3);
  }

  .difficulty { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .difficulty button.active {
    background: var(--grad);
    color: #082f49;
    -webkit-text-fill-color: #082f49;
    border-color: transparent;
    box-shadow: 0 4px 16px rgba(56, 189, 248, .35);
  }
  .difficulty button.active:hover {
    background: var(--grad);
    border-color: transparent;
    box-shadow: 0 6px 22px rgba(56, 189, 248, .45);
  }

  /* Scoreboard */
  .scores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    text-align: center;
    margin-bottom: 16px;
  }
  .score-box {
    background: var(--glass-2);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 12px 6px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07);
  }
  .score-box .label { font-size: .72rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  .score-box .value {
    font-size: 1.7rem;
    font-weight: 700;
    margin-top: 2px;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }
  .score-box.x .value { background: var(--grad); -webkit-background-clip: text; background-clip: text; }
  .score-box.o .value { background: var(--grad-o); -webkit-background-clip: text; background-clip: text; }
  .score-box.d .value { background: var(--grad-win); -webkit-background-clip: text; background-clip: text; }

  .history-title {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #history {
    list-style: none;
    max-height: 320px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: rgba(56, 189, 248, .45) transparent;
  }
  #history::-webkit-scrollbar { width: 8px; }
  #history::-webkit-scrollbar-track { background: transparent; }
  #history::-webkit-scrollbar-thumb {
    background: rgba(56, 189, 248, .35);
    border-radius: 99px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  #history::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, .6); background-clip: padding-box; }
  #history li {
    background: var(--glass-2);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: .85rem;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    transition: background .2s var(--ease), border-color .2s var(--ease);
  }
  #history li:hover {
    background: rgba(255, 255, 255, .13);
    border-color: rgba(56, 189, 248, .35);
  }
  #history li .who { font-weight: 700; }
  #history li .who.x { color: var(--x-color); }
  #history li .who.o { color: var(--o-color); }
  #history li .who.d { color: var(--win); }
  #history li .meta { color: var(--muted); font-size: .78rem; text-align: right; }
  #history .empty {
    justify-content: center;
    color: var(--muted);
    background: transparent;
    border-color: transparent;
    box-shadow: none;
    letter-spacing: 1px;
  }

  .db-badge {
    text-align: center;
    font-size: .72rem;
    color: var(--muted);
    margin-top: 16px;
    padding: 7px 12px;
    border-radius: 999px;
    background: var(--glass-2);
    border: 1px solid var(--glass-border);
    display: inline-flex;
    width: 100%;
    justify-content: center;
    letter-spacing: .5px;
  }
  .db-badge span { color: var(--win); }
</style>
</head>
<body>
<div class="app">
  <h1>Tic Tac Toe</h1>
  <p class="subtitle">You are X · Computer is O · Scores saved in your browser's local database</p>

  <div class="layout">
    <!-- Game -->
    <div class="card">
      <div id="status">Your turn — click a square</div>
      <div class="stage" id="stage" aria-label="Tic Tac Toe board"></div>
      <div class="controls">
        <button class="primary" id="newRound">New Round</button>
      </div>
      <div class="difficulty">
        <button id="diffEasy">Easy (random)</button>
        <button id="diffHard" class="active">Hard (unbeatable)</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="card">
      <div class="scores">
        <div class="score-box x"><div class="label">You (X)</div><div class="value" id="scoreX">0</div></div>
        <div class="score-box d"><div class="label">Draws</div><div class="value" id="scoreD">0</div></div>
        <div class="score-box o"><div class="label">CPU (O)</div><div class="value" id="scoreO">0</div></div>
      </div>

      <div class="history-title">
        <span>Game History</span>
        <button class="danger" id="clearBtn" style="padding:4px 10px;font-size:.75rem;">Clear History</button>
      </div>
      <ul id="history"><li class="empty">No games yet</li></ul>

      <div class="db-badge" id="dbBadge">Database: <span>connecting…</span></div>
    </div>
  </div>
</div>

<script type="module">
(async function () {
  "use strict";

  // ---------------------------------------------------------------
  // Libraries: three.js via dynamic import (graceful fallback)
  // ---------------------------------------------------------------
  let THREE = null;
  try {
    THREE = await import("three");
  } catch (e) {
    console.warn("three.js could not be loaded — using simplified board.", e);
  }

  // ---------------------------------------------------------------
  // Storage layer: IndexedDB with localStorage fallback
  // ---------------------------------------------------------------
  const DB_NAME = "tictactoe-db";
  const DB_VERSION = 1;
  const STORE_GAMES = "games";
  const STORE_SCORES = "scores";
  const SCORE_KEY = "totals";

  const Storage = (function () {
    let db = null;
    let mode = "idb"; // "idb" | "ls"

    function openIDB() {
      return new Promise((resolve) => {
        if (!("indexedDB" in window)) return resolve(null);
        let req;
        try { req = indexedDB.open(DB_NAME, DB_VERSION); }
        catch (e) { return resolve(null); }
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains(STORE_GAMES)) {
            d.createObjectStore(STORE_GAMES, { keyPath: "id", autoIncrement: true });
          }
          if (!d.objectStoreNames.contains(STORE_SCORES)) {
            d.createObjectStore(STORE_SCORES);
          }
        };
        req.onsuccess = (e) => {
          const d = e.target.result;
          d.onversionchange = () => d.close();
          resolve(d);
        };
        req.onerror = () => resolve(null);
        req.onblocked = () => resolve(null);
      });
    }

    function lsGet(store, key, fallback) {
      try {
        const raw = localStorage.getItem("ttt:" + store + ":" + key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) { return fallback; }
    }
    function lsSet(store, key, value) {
      try { localStorage.setItem("ttt:" + store + ":" + key, JSON.stringify(value)); } catch (e) {}
    }

    function idbTx(stores, fn) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(stores, "readwrite");
        let result;
        try { result = fn(stores.map((s) => tx.objectStore(s))); }
        catch (e) { reject(e); return; }
        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error("aborted"));
      });
    }

    return {
      get mode() { return mode; },

      async init() {
        db = await openIDB();
        if (!db) mode = "ls";
        return mode;
      },

      async getScores() {
        if (mode === "idb") {
          return new Promise((resolve) => {
            try {
              const tx = db.transaction(STORE_SCORES, "readonly");
              const req = tx.objectStore(STORE_SCORES).get(SCORE_KEY);
              req.onsuccess = () => resolve(req.result || { x: 0, o: 0, d: 0 });
              req.onerror = () => resolve({ x: 0, o: 0, d: 0 });
            } catch (e) { resolve({ x: 0, o: 0, d: 0 }); }
          });
        }
        return lsGet(STORE_SCORES, SCORE_KEY, { x: 0, o: 0, d: 0 });
      },

      async addGame(game) {
        if (mode === "idb") {
          await idbTx([STORE_GAMES, STORE_SCORES], ([games, scores]) => {
            games.add(game);
            const req = scores.get(SCORE_KEY);
            req.onsuccess = () => {
              const t = req.result || { x: 0, o: 0, d: 0 };
              if (game.winner === "X") t.x++;
              else if (game.winner === "O") t.o++;
              else t.d++;
              t.updated = Date.now();
              scores.put(t, SCORE_KEY);
            };
          });
          return;
        }
        // localStorage fallback
        const all = lsGet(STORE_GAMES, "all", []);
        game.id = all.length ? all[all.length - 1].id + 1 : 1;
        all.push(game);
        lsSet(STORE_GAMES, "all", all);
        const t = lsGet(STORE_SCORES, SCORE_KEY, { x: 0, o: 0, d: 0 });
        if (game.winner === "X") t.x++;
        else if (game.winner === "O") t.o++;
        else t.d++;
        t.updated = Date.now();
        lsSet(STORE_SCORES, SCORE_KEY, t);
      },

      async getGames(limit) {
        if (mode === "idb") {
          return new Promise((resolve) => {
            try {
              const tx = db.transaction(STORE_GAMES, "readonly");
              const store = tx.objectStore(STORE_GAMES);
              const out = [];
              const req = store.openCursor(null, "prev");
              req.onsuccess = (e) => {
                const cur = e.target.result;
                if (cur && out.length < limit) {
                  out.push(cur.value);
                  cur.continue();
                } else {
                  resolve(out);
                }
              };
              req.onerror = () => resolve(out);
            } catch (e) { resolve([]); }
          });
        }
        const all = lsGet(STORE_GAMES, "all", []);
        return all.slice(-limit).reverse();
      },

      async clearAll() {
        if (mode === "idb") {
          await idbTx([STORE_GAMES, STORE_SCORES], ([games, scores]) => {
            games.clear();
            scores.clear();
          });
          return;
        }
        try {
          localStorage.removeItem("ttt:" + STORE_GAMES + ":all");
          localStorage.removeItem("ttt:" + STORE_SCORES + ":" + SCORE_KEY);
        } catch (e) {}
      },
    };
  })();

  // ---------------------------------------------------------------
  // anime.js helpers (guarded — instant fallback if unavailable)
  // ---------------------------------------------------------------
  const A = window.anime || {};
  const st = typeof A.stagger === "function" ? A.stagger : () => 0;

  function anim(target, params) {
    if (typeof A.animate === "function") {
      try { return A.animate(target, params); } catch (e) { /* fall through */ }
    }
    // Fallback: apply final values immediately
    const skip = { duration: 1, delay: 1, ease: 1, loop: 1, alternate: 1, autoplay: 1, onComplete: 1, onUpdate: 1, defaults: 1 };
    for (const k in params) {
      if (skip[k]) continue;
      let v = params[k];
      if (Array.isArray(v)) v = v[v.length - 1];
      if (typeof v === "number" && target && typeof target === "object" && k in target) { try { target[k] = v; } catch (e) {} }
    }
    if (typeof params.onUpdate === "function") params.onUpdate();
    if (typeof params.onComplete === "function") params.onComplete();
    return { pause() {}, play() {}, revert() {} };
  }

  // ---------------------------------------------------------------
  // Game logic
  // ---------------------------------------------------------------
  const LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6],
  ];
  const EMPTY = " ";
  let board = Array(9).fill(EMPTY);
  let current = "X";          // X = human, O = computer
  let gameOver = false;
  let difficulty = "hard";    // "easy" | "hard"
  const moves = [];           // record of moves for history
  let startedAt = Date.now();
  let thinking = false;       // AI is thinking (drives 3D base glow)
  let aiTimer = null;         // pending AI move timer (cancellable)

  const stageEl = document.getElementById("stage");
  const statusEl = document.getElementById("status");
  const scoreXEl = document.getElementById("scoreX");
  const scoreOEl = document.getElementById("scoreO");
  const scoreDEl = document.getElementById("scoreD");
  const historyEl = document.getElementById("history");
  const dbBadgeEl = document.getElementById("dbBadge");

  const WIN_LINES = (() => {
    const winnerOf = (b) => {
      for (const l of LINES) {
        const [a, c, d] = l;
        if (b[a] !== EMPTY && b[a] === b[c] && b[a] === b[d]) return { player: b[a], line: l };
      }
      if (b.every((v) => v !== EMPTY)) return { player: "draw", line: null };
      return null;
    };
    return winnerOf;
  })();

  function setStatus(text, isThinking) {
    if (statusEl.textContent !== text) {
      statusEl.textContent = text;
      anim(statusEl, { opacity: [0, 1], y: [-7, 0], duration: 340, ease: "outCubic" });
    }
    statusEl.classList.toggle("thinking", !!isThinking);
    thinking = !!isThinking;
  }

  function render() {
    if (view) view.sync(board, gameOver, current);
  }

  function canPlay(i) {
    return !gameOver && current === "X" && board[i] === EMPTY;
  }

  function checkResult() {
    const r = WIN_LINES(board);
    if (!r) return null;
    gameOver = true;
    if (r.player === "draw") {
      setStatus("It's a draw!", false);
    } else {
      setStatus(r.player === "X" ? "You win! 🎉" : "Computer wins!", false);
    }
    render();
    if (r.player === "draw") view.draw();
    else view.winLine(r.line, r.player);
    saveGame(r.player === "draw" ? "draw" : r.player);
    return r;
  }

  async function saveGame(winner) {
    const game = {
      moves: moves.slice(),
      winner: winner,
      startedAt: startedAt,
      endedAt: Date.now(),
      duration: Date.now() - startedAt,
      difficulty: difficulty,
    };
    try {
      await Storage.addGame(game);
      await refreshStats();
    } catch (e) {
      /* keep game playable even if storage fails */
    }
  }

  // ---------------------------------------------------------------
  // AI
  // ---------------------------------------------------------------
  function emptyCells(b) {
    const out = [];
    for (let i = 0; i < 9; i++) if (b[i] === EMPTY) out.push(i);
    return out;
  }

  function randomMove(b) {
    const cells = emptyCells(b);
    return cells[Math.floor(Math.random() * cells.length)];
  }

  // Minimax (best play for O)
  function minimax(b, player, depth) {
    const r = WIN_LINES(b);
    if (r) {
      if (r.player === "O") return { score: 10 - depth };
      if (r.player === "X") return { score: depth - 10 };
      return { score: 0 };
    }
    let best = null;
    for (const i of emptyCells(b)) {
      b[i] = player;
      const res = minimax(b, player === "O" ? "X" : "O", depth + 1);
      b[i] = EMPTY;
      if (player === "O") {
        if (!best || res.score > best.score) best = { score: res.score, move: i };
      } else {
        if (!best || res.score < best.score) best = { score: res.score, move: i };
      }
    }
    return best;
  }

  function computerMove() {
    if (gameOver) return;
    setStatus("Computer is thinking…", true);
    if (aiTimer) clearTimeout(aiTimer);
    aiTimer = setTimeout(() => {
      aiTimer = null;
      if (gameOver) return;
      let idx;
      if (difficulty === "easy") {
        idx = randomMove(board);
      } else {
        const best = minimax(board.slice(), "O", 0);
        idx = best ? best.move : randomMove(board);
      }
      if (idx === undefined || idx === null) idx = randomMove(board);
      applyMove(idx, "O");
      if (!checkResult()) {
        current = "X";
        setStatus("Your turn — click a square", false);
        render();
      }
    }, 450);
  }

  function applyMove(i, player) {
    board[i] = player;
    moves.push({ p: player, i: i });
    if (view) view.place(i, player);
  }

  function humanMove(i) {
    if (!canPlay(i)) return;
    applyMove(i, "X");
    if (checkResult()) return;
    current = "O";
    render();
    computerMove();
  }

  function newRound() {
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
    board = Array(9).fill(EMPTY);
    moves.length = 0;
    current = "X";
    gameOver = false;
    startedAt = Date.now();
    setStatus("Your turn — click a square", false);
    if (view) view.clear(true);
    render();
  }

  // ---------------------------------------------------------------
  // 3D view (three.js) — tilted board, parallax, raycast input
  // ---------------------------------------------------------------
  function create3DView(THREE_LIB, stage) {
    let renderer;
    try {
      renderer = new THREE_LIB.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    } catch (e) { return null; }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE_LIB.PCFShadowMap;
    renderer.toneMapping = THREE_LIB.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.domElement.style.width = "100%";
    renderer.domElement.style.height = "100%";
    stage.appendChild(renderer.domElement);

    const scene = new THREE_LIB.Scene();
    const camera = new THREE_LIB.PerspectiveCamera(42, 1, 0.1, 100);
    camera.position.set(0, 7.4, 7.0); // animates down to the play position

    const boardGroup = new THREE_LIB.Group();
    scene.add(boardGroup);

    const PITCH = 1.14;            // cell 1.0 + gap 0.14
    const TILE_H = 0.18;
    const posOf = (i) => ({ x: (i % 3 - 1) * PITCH, z: (Math.floor(i / 3) - 1) * PITCH });

    // --- lighting
    scene.add(new THREE_LIB.HemisphereLight(0xbfd7ff, 0x0b1020, 0.55));
    const key = new THREE_LIB.DirectionalLight(0xffffff, 2.3);
    key.position.set(4, 8, 5);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -5; key.shadow.camera.right = 5;
    key.shadow.camera.top = 5; key.shadow.camera.bottom = -5;
    key.shadow.camera.near = 1; key.shadow.camera.far = 25;
    key.shadow.camera.updateProjectionMatrix();
    key.shadow.bias = -0.0006;
    scene.add(key);
    const fill = new THREE_LIB.DirectionalLight(0xff9ec4, 0.65);
    fill.position.set(-5, 3, -4);
    scene.add(fill);

    // --- base plate (glows while the AI thinks)
    const baseMat = new THREE_LIB.MeshStandardMaterial({
      color: 0x101a30, roughness: 0.5, metalness: 0.3,
      emissive: 0x38bdf8, emissiveIntensity: 0,
    });
    const plateSize = 3 * PITCH + 0.55;
    const base = new THREE_LIB.Mesh(new THREE_LIB.BoxGeometry(plateSize, 0.3, plateSize), baseMat);
    base.position.y = -0.15;
    base.receiveShadow = true;
    boardGroup.add(base);

    // --- tiles
    const tiles = [];
    const tileGeo = new THREE_LIB.BoxGeometry(1, TILE_H, 1);
    for (let i = 0; i < 9; i++) {
      const mat = new THREE_LIB.MeshStandardMaterial({
        color: 0x1f2b45, roughness: 0.45, metalness: 0.18,
        emissive: 0x38bdf8, emissiveIntensity: 0,
      });
      const mesh = new THREE_LIB.Mesh(tileGeo, mat);
      const p = posOf(i);
      mesh.position.set(p.x, TILE_H / 2, p.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData.index = i;
      boardGroup.add(mesh);
      tiles.push(mesh);
    }

    // --- mark materials / geometry (shared)
    const matX = new THREE_LIB.MeshStandardMaterial({
      color: 0x38bdf8, emissive: 0x0ea5e9, emissiveIntensity: 0.85, roughness: 0.3, metalness: 0.15,
    });
    const matO = new THREE_LIB.MeshStandardMaterial({
      color: 0xf472b6, emissive: 0xdb2777, emissiveIntensity: 0.85, roughness: 0.3, metalness: 0.15,
    });
    const barGeo = new THREE_LIB.BoxGeometry(0.64, 0.1, 0.1);
    const ringGeo = new THREE_LIB.TorusGeometry(0.26, 0.055, 14, 40);

    const marks = [];
    let beam = null;

    function place(i, player) {
      removeMark(i, false);
      const p = posOf(i);
      const g = new THREE_LIB.Group();
      g.position.set(p.x, 0.85, p.z);
      if (player === "X") {
        const b1 = new THREE_LIB.Mesh(barGeo, matX); b1.rotation.y = Math.PI / 4; b1.castShadow = true;
        const b2 = new THREE_LIB.Mesh(barGeo, matX); b2.rotation.y = -Math.PI / 4; b2.castShadow = true;
        g.add(b1, b2);
      } else {
        const ring = new THREE_LIB.Mesh(ringGeo, matO);
        ring.rotation.x = -Math.PI / 2;
        ring.castShadow = true;
        g.add(ring);
      }
      g.scale.setScalar(0.001);
      boardGroup.add(g);
      marks[i] = g;
      anim(g.scale, { x: 1, y: 1, z: 1, duration: 500, ease: "outBack" });
      anim(g.position, { y: 0.24, duration: 500, ease: "outCubic" });
    }

    function removeMark(i, animated) {
      const g = marks[i];
      if (!g) return;
      marks[i] = null;
      if (!animated) { boardGroup.remove(g); return; }
      anim(g.scale, {
        x: 0.001, y: 0.001, z: 0.001, duration: 220, ease: "inCubic",
        onComplete: () => boardGroup.remove(g),
      });
    }

    function clear(animated) {
      if (beam) {
        boardGroup.remove(beam);
        beam.geometry.dispose();
        beam.material.dispose();
        beam = null;
      }
      for (let i = 0; i < 9; i++) removeMark(i, animated);
      boardGroup.position.set(0, 0, 0);
      tiles.forEach((t) => { t.position.y = TILE_H / 2; });
      setHover(-1);
    }

    function winLine(line, player) {
      const a = posOf(line[0]);
      const b = posOf(line[2]);
      const dx = b.x - a.x, dz = b.z - a.z;
      const len = Math.hypot(dx, dz) + 0.9;
      const color = player === "X" ? 0x38bdf8 : 0xf472b6;
      const bm = new THREE_LIB.Mesh(
        new THREE_LIB.BoxGeometry(1, 1, 1),
        new THREE_LIB.MeshStandardMaterial({
          color: color, emissive: color, emissiveIntensity: 1.5,
          roughness: 0.3, transparent: true, opacity: 0.95,
        })
      );
      bm.position.set((a.x + b.x) / 2, 0.46, (a.z + b.z) / 2);
      bm.rotation.y = Math.atan2(-dz, dx);
      bm.scale.set(0.001, 0.07, 0.07);
      boardGroup.add(bm);
      beam = bm;
      // glowing beam draws across the winning line
      anim(bm.scale, { x: [0.001, len], duration: 430, delay: 240, ease: "outCubic" });
      // winning marks pulse
      line.forEach((idx, n) => {
        const g = marks[idx];
        if (!g) return;
        anim(g.scale, {
          x: [1, 1.3, 1], y: [1, 1.3, 1], z: [1, 1.3, 1],
          duration: 720, delay: 300 + n * 130, ease: "inOutQuad",
        });
      });
      // board does a small celebratory rock
      anim(boardGroup.position, { y: [0, 0.18, 0], duration: 660, delay: 280, ease: "inOutQuad" });
    }

    function draw() {
      anim(boardGroup.position, { x: [0, 0.11, -0.11, 0.06, 0], duration: 470, ease: "inOutQuad" });
    }

    // --- input: raycast hover + click, pointer parallax
    const raycaster = new THREE_LIB.Raycaster();
    const ndc = new THREE_LIB.Vector2();
    const rotTarget = { x: 0, y: 0 };
    let hovered = -1;

    function pick(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      if (!rect.width || !rect.height) return -1;
      ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObjects(tiles, false);
      return hits.length ? hits[0].object.userData.index : -1;
    }

    function setHover(i) {
      if (i === hovered) return;
      if (hovered >= 0) {
        const t = tiles[hovered];
        anim(t.position, { y: TILE_H / 2, duration: 160, ease: "outQuad" });
      }
      hovered = i;
      if (hovered >= 0) {
        const t = tiles[hovered];
        anim(t.position, { y: TILE_H / 2 + 0.16, duration: 180, ease: "outQuad" });
      }
      stage.style.cursor = hovered >= 0 ? "pointer" : "default";
    }

    stage.addEventListener("pointermove", (e) => {
      const rect = stage.getBoundingClientRect();
      const nx = rect.width ? ((e.clientX - rect.left) / rect.width) * 2 - 1 : 0;
      const ny = rect.height ? ((e.clientY - rect.top) / rect.height) * 2 - 1 : 0;
      rotTarget.y = nx * 0.16;
      rotTarget.x = ny * 0.10;
      const idx = pick(e.clientX, e.clientY);
      setHover(idx >= 0 && canPlay(idx) ? idx : -1);
    });
    stage.addEventListener("pointerleave", () => {
      rotTarget.x = 0;
      rotTarget.y = 0;
      setHover(-1);
    });
    stage.addEventListener("click", (e) => {
      const idx = pick(e.clientX, e.clientY);
      if (idx >= 0 && canPlay(idx)) humanMove(idx);
    });

    // --- render loop: parallax lerp, AI glow, camera framing
    renderer.setAnimationLoop(() => {
      boardGroup.rotation.x += (rotTarget.x - boardGroup.rotation.x) * 0.07;
      boardGroup.rotation.y += (rotTarget.y - boardGroup.rotation.y) * 0.07;
      camera.lookAt(0, 0, 0);
      const t = performance.now() * 0.001;
      baseMat.emissiveIntensity = thinking ? 0.1 + 0.1 * (0.5 + 0.5 * Math.sin(t * 5)) : 0;
      renderer.render(scene, camera);
    });

    // --- resize with the responsive layout
    function resize() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    if ("ResizeObserver" in window) new ResizeObserver(resize).observe(stage);
    window.addEventListener("resize", resize);
    resize();

    // camera swoops in
    anim(camera.position, { y: 5.05, z: 4.85, duration: 1100, ease: "outCubic" });

    return {
      kind: "3d",
      place,
      clear,
      winLine,
      draw,
      sync(b, over, cur) { if (over || cur !== "X") setHover(-1); },
    };
  }

  // ---------------------------------------------------------------
  // DOM fallback view (no WebGL / no three.js)
  // ---------------------------------------------------------------
  function createFallbackView(stage, playable, onMove) {
    const grid = document.createElement("div");
    grid.className = "fb-board";
    const btns = [];
    for (let i = 0; i < 9; i++) {
      const b = document.createElement("button");
      b.type = "button";
      b.addEventListener("click", () => { if (playable(i)) onMove(i); });
      grid.appendChild(b);
      btns.push(b);
    }
    stage.appendChild(grid);
    return {
      kind: "dom",
      place(i, p) { btns[i].textContent = p; btns[i].className = p === "X" ? "x" : "o"; },
      clear() { btns.forEach((b) => { b.textContent = ""; b.className = ""; b.disabled = true; }); },
      winLine(line) { line.forEach((i) => btns[i].classList.add("win")); },
      draw() { anim(grid, { x: [0, 8, -8, 4, 0], duration: 420, ease: "inOutQuad" }); },
      sync(b, over, cur) {
        btns.forEach((el, i) => {
          const v = b[i];
          el.textContent = v === " " ? "" : v;
          if (!el.classList.contains("win")) el.className = v === "X" ? "x" : v === "O" ? "o" : "";
          el.disabled = over || cur !== "X" || v !== " ";
        });
      },
    };
  }

  // --- view bootstrap
  let view = null;
  if (THREE) {
    try { view = create3DView(THREE, stageEl); } catch (e) { console.warn("3D init failed", e); }
  }
  if (!view) {
    view = createFallbackView(stageEl, canPlay, humanMove);
    const note = document.createElement("div");
    note.className = "stage-note";
    note.textContent = THREE ? "WebGL unavailable — simplified board" : "3D library unavailable — simplified board";
    stageEl.appendChild(note);
  }

  // ---------------------------------------------------------------
  // Stats / history UI
  // ---------------------------------------------------------------
  function fmtDate(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
      " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function setScore(el, v) {
    const s = String(v || 0);
    if (el.textContent === s) return;
    el.textContent = s;
    anim(el, { scale: [1.4, 1], duration: 460, ease: "outBack" });
  }

  async function refreshStats() {
    const t = await Storage.getScores();
    setScore(scoreXEl, t.x);
    setScore(scoreOEl, t.o);
    setScore(scoreDEl, t.d);

    const games = await Storage.getGames(25);
    if (!games.length) {
      historyEl.innerHTML = '<li class="empty">No games yet</li>';
      return;
    }
    historyEl.innerHTML = "";
    for (const g of games) {
      const li = document.createElement("li");
      const who = document.createElement("span");
      const isDraw = g.winner === "draw";
      who.className = "who " + (isDraw ? "d" : g.winner.toLowerCase());
      who.textContent = isDraw ? "Draw" : (g.winner === "X" ? "You won" : "CPU won");
      const meta = document.createElement("span");
      meta.className = "meta";
      const movesN = Array.isArray(g.moves) ? g.moves.length : "?";
      meta.textContent = movesN + " moves · " + (g.difficulty || "hard") + " · " + fmtDate(g.endedAt || g.startedAt || Date.now());
      li.appendChild(who);
      li.appendChild(meta);
      historyEl.appendChild(li);
    }
    anim(Array.from(historyEl.children), {
      opacity: [0, 1], y: [10, 0], duration: 330, delay: st(24), ease: "outCubic",
    });
  }

  // ---------------------------------------------------------------
  // Controls
  // ---------------------------------------------------------------
  function pop(el, from) {
    if (!el) return;
    el.style.transition = "none";
    anim(el, {
      scale: [from || 0.9, 1], duration: 400, ease: "outBack",
      onComplete: () => { el.style.transition = ""; },
    });
  }

  const newRoundBtn = document.getElementById("newRound");
  newRoundBtn.addEventListener("click", () => {
    pop(newRoundBtn);
    newRound();
  });

  const clearBtnEl = document.getElementById("clearBtn");
  clearBtnEl.addEventListener("click", async () => {
    pop(clearBtnEl, 0.94);
    if (!confirm("Clear all scores and game history from the local database?")) return;
    try {
      await Storage.clearAll();
      await refreshStats();
    } catch (e) {}
  });

  const diffEasyBtn = document.getElementById("diffEasy");
  const diffHardBtn = document.getElementById("diffHard");
  function setDifficulty(d) {
    difficulty = d;
    diffEasyBtn.classList.toggle("active", d === "easy");
    diffHardBtn.classList.toggle("active", d === "hard");
    pop(d === "easy" ? diffEasyBtn : diffHardBtn);
    newRound();
  }
  diffEasyBtn.addEventListener("click", () => setDifficulty("easy"));
  diffHardBtn.addEventListener("click", () => setDifficulty("hard"));

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  (async function boot() {
    anim("h1", { opacity: [0, 1], y: [-14, 0], duration: 700, ease: "outCubic" });
    anim(".subtitle", { opacity: [0, 1], duration: 800, delay: 120, ease: "outQuad" });
    anim(".card", { opacity: [0, 1], y: [18, 0], duration: 650, delay: st(140), ease: "outCubic" });
    const mode = await Storage.init();
    dbBadgeEl.innerHTML = mode === "idb"
      ? 'Database: <span>IndexedDB (tictactoe-db)</span>'
      : 'Database: <span>localStorage fallback</span>';
    await refreshStats();
    newRound();
  })();
})();
</script>
</body>
</html>
